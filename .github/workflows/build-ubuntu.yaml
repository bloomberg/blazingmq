name: Build Ubuntu

description: |
  This is a reusable workflow to build BlazingMQ on Ubuntu.
  Optionally run unit tests if the target is "all.t".
  Given a ref and a target, this workflow will build the project and optionally save the build results as an artifact.
  The artifact key is generated based on the ref and the target, and is returned via workflow output.
  Compilation is accelerated with ccache.  The ccache directory is restored from the most recent
  cache for the same C++ standard, and saved only on pushes to main.

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch name, tag, or commit SHA to build"
        required: true
        type: string
      target:
        description: "Build targets, space-delimited"
        required: true
        type: string
      save_build_as_artifacts:
        description: "Whether to save the build as artifacts"
        required: true
        type: boolean
      run_unit_tests:
        description: "Whether to run unit tests.  Can only be set to true if `all.t` is one of the build targets"
        required: true
        type: boolean
      name:
        description: "Name of the workflow run, used for artifacts"
        required: false
        type: string
        default: "build-ubuntu"
      cxx_standard:
        description: "What C++ Standard to build with.  [cpp03, cpp11, cpp14, cpp17, cpp20, cpp23]"
        required: true
        type: string
    outputs:
      artifact_key:
        description: "GH Actions Cache key associated with the built dependencies"
        value: ${{ jobs.build_ubuntu.outputs.artifact_key }}

permissions:
  contents: read

jobs:
  get_dependencies:
    name: "Dependencies"
    uses: ./.github/workflows/dependencies.yaml
    with:
      cxx_standard: ${{ inputs.cxx_standard }}

  build_ubuntu:
    name: Build [ubuntu, ${{ inputs.cxx_standard }}] ${{ inputs.ref }} ${{ inputs.target }}
    runs-on: ubuntu-latest
    needs: get_dependencies
    outputs:
      artifact_key: ${{ steps.get_cache_key.outputs.artifact_key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Since input.ref can be a branch, tag or commit SHA,
      # we need to get the commit SHA to use it in the artifact key.
      - name: Generate artifact key from commit SHA
        id: get_cache_key
        if: inputs.save_build_as_artifacts == true # Variable type is boolean, thus no quotes
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "artifact_key=${{ inputs.name }}-${{ inputs.target }}-${COMMIT_SHA}" >> $GITHUB_OUTPUT

      # The following steps restore cached deps
      # If the cache is not hit, it will build and install the dependencies
      # If the cache is hit, building deps is skipped, only make install is run
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            /opt/bb
          key: ${{ needs.get_dependencies.outputs.cache_key }}
      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qy build-essential \
            gdb \
            curl \
            python3.10 \
            python3-pip \
            cmake \
            ninja-build \
            ccache \
            pkg-config \
            bison \
            libfl-dev \
            libbenchmark-dev \
            libz-dev

      # The ccache directory lives outside the workspace so that the "*.o"
      # clean-up below cannot touch it.
      - name: Set up ccache
        if: inputs.target != '' # Variable type is string, thus using quotes
        run: |
          {
            echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_MAXSIZE=2G"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
      - name: Restore ccache
        if: inputs.target != '' # Variable type is string, thus using quotes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cxx_standard }}-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cxx_standard }}-${{ inputs.target }}-
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cxx_standard }}-

      # Build BlazingMQ
      - name: Configure BlazingMQ
        run: cmake --preset gh-build-ubuntu-latest-${{ inputs.cxx_standard }} -S .

      - name: Build BlazingMQ
        if: inputs.target != '' # Variable type is string, thus using quotes
        run: |
          ccache --zero-stats
          BUILD_START=$(date +%s)
          echo "::add-matcher::.github/workflows/problem-matchers/cpp.json"
          cmake --build --preset gh-build-ubuntu-latest-${{ inputs.cxx_standard }} --target ${{ inputs.target }}
          echo "::remove-matcher owner=cpp"
          ccache --show-stats --verbose
          # Cache hits refresh an entry's mtime, so this drops only entries
          # unused by this build and keeps the saved cache small.
          ccache --evict-older-than "$(( $(date +%s) - BUILD_START + 60 ))s"
          ccache --show-stats

      - name: Save ccache
        if: inputs.target != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' # Variable type is string, thus using quotes
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cxx_standard }}-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Clean-up build directories before upload
        run: |
          find . -name "*.o" -type f -delete
          find . -name "*.a" -type f -delete

      - name: Run UT [c++]
        if: contains(inputs.target, 'all.t') && inputs.run_unit_tests == true # Variable type is boolean, thus no quotes
        run: |
          ctest --preset gh-build-ubuntu-latest-${{ inputs.cxx_standard }}

      - name: Fail if requested to run UTs, they were not built
        if: contains(inputs.target, 'all.t') == false && inputs.run_unit_tests == true # Variable type is boolean, thus no quotes
        run: |
          echo "Unit tests were requested to run, but the target does not include 'all.t'."
          echo "Please set the target to include 'all.t' to build unit tests."
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.save_build_as_artifacts == true # Variable type is boolean, thus no quotes
        with:
          path: |
            build/blazingmq
            deps
          name: ${{ steps.get_cache_key.outputs.artifact_key }}
          retention-days: 1
