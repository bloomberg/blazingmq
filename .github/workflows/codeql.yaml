---
name: CodeQL

# C/C++ is analyzed without a traced compilation, which costs a checkout
# instead of a full rebuild and can therefore run on every pull request.  In
# exchange CodeQL cannot see sources generated at build time and resolves fewer
# types, so some alerts are missed.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'integration/**'
  schedule:
    # Run weekly on Mondays.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "CodeQL [${{ matrix.language }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Needed to fetch the workflow run status for diff-informed analysis.
      actions: read
      # Needed to upload the analysis results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/workflows/ext/codeql-config.yaml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
