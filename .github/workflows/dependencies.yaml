name: Dependencies

on:
  workflow_call:
    inputs:
      cxx_standard:
        description: "What C++ Standard to build with.  [cpp03, cpp11, cpp14, cpp17, cpp20, cpp23]"
        required: true
        type: string
        default: "cpp23"
    outputs:
      cache_key:
        description: "GH Actions Cache key associated with the built dependencies"
        value: ${{ jobs.build_dependencies.outputs.cache_key }}

permissions:
  contents: read

jobs:
  build_dependencies:
    name: Build and cache dependencies [${{ inputs.cxx_standard }}]
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.get-cache-key.outputs.cache_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate dependencies cache key
        id: get-cache-key
        run: |
          echo "cache_key=deps-${{ inputs.cxx_standard }}-`date +%y-%m-%d`-`cat docker/build_deps.sh | shasum`" >> $GITHUB_OUTPUT

      - name: Cache lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-lookup
        with:
          path: |
            deps
            /opt/bb
          key: ${{ steps.get-cache-key.outputs.cache_key }}
          lookup-only: true

      - name: Set up build dependencies
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -qy build-essential \
            gdb \
            curl \
            python3.10 \
            python3-pip \
            cmake \
            ninja-build \
            pkg-config \
            bison \
            libfl-dev \
            libbenchmark-dev \
            libz-dev

      - name: Fetch & build non packaged dependencies
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        run: |
          mkdir -p deps
          cd deps
          ../docker/build_deps.sh --cxx-standard=${{ inputs.cxx_standard }}

      - name: Cache save
        if: steps.cache-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            /opt/bb
          key: ${{ steps.get-cache-key.outputs.cache_key }}
