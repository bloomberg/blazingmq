name: Publish release

on:
  push:
    # Publish `v*` tags as releases.
    tags:
      - v[0-9]+.[0-9]+.[0-9]+           # Releases
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+  # Release Candidates

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  create-github-prerelease:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.ref_name, 'rc')
    permissions:
      # Let the default GITHUB_TOKEN create the release.
      contents: write

    steps:
      - name: Create release candidate
        id: create_release_candidate
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # 19 Jun 2026, v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_name: Release Candidate ${{ github.ref_name }}
          draft: true           # So we can write release notes
          prerelease: true
          generate_release_notes: true

  create-github-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.ref_name, 'rc')
    permissions:
      # Let the default GITHUB_TOKEN create the release.
      contents: write

    steps:
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # 19 Jun 2026, v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          draft: true           # So we can write release notes
          prerelease: false
          generate_release_notes: true

  build-and-publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Let the default GITHUB_TOKEN push the image to GHCR.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # 22 May 2026, v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # 22 May 2026, v4.3.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # 22 May 2026, v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # 21 May 2026, v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
